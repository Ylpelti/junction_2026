services:
  - type: web
    name: cancersignal-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: cancersignal/backend
    buildCommand: pip install -e .
    startCommand: >-
      python -m alembic upgrade head &&
      python -m app.db.seed &&
      python -m app.db.demo seed &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: POSTGRES_DB
        fromDatabase:
          name: cancersignal-demo-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: cancersignal-demo-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: cancersignal-demo-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: cancersignal-demo-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: cancersignal-demo-db
          property: port
      - key: CANCERSIGNAL_EXTRACTION
        value: "off"

  - type: web
    name: cancersignal-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: cancersignal/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: CANCERSIGNAL_API_INTERNAL_HOSTPORT
        fromService:
          name: cancersignal-api
          type: web
          property: hostport

databases:
  - name: cancersignal-demo-db
    databaseName: cancersignal
    user: cancersignal
    plan: free
    region: frankfurt
