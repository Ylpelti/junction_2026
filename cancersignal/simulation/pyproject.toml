[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cancersignal-pathway-simulation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["simpy>=4.1,<5", "matplotlib>=3.8,<4"]

[project.scripts]
cancersignal-sim = "cancersignal_sim.cli:main"

[tool.setuptools.packages.find]
include = ["cancersignal_sim*"]
