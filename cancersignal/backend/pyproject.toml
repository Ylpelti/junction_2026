[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cancersignal-backend"
version = "0.1.0"
description = "Minimal CancerSignal API and database foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pgvector>=0.3,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
llm = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a migrated PostgreSQL test database"]
